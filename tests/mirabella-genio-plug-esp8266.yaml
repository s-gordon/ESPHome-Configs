# CI fixture: Mirabella Genio smart plug, ESP8266.
# Packages are included by local path so CI validates the working tree,
# not whatever is currently published on main.
substitutions:
  name: "ci-genio-plug"
  friendly_name: "CI Genio Plug"

packages:
  base: !include ../esphome/packages/config/mirabella/genio-smart-plug/base-esp8266.yaml
  variant: !include ../esphome/packages/config/mirabella/genio-smart-plug/plug-esp8266.yaml

api:
  encryption:
    key: !secret apikey

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
