# CI fixture: DETA Grid Connect switch, ESP8266 + 3-gang-middle-fan.
# Packages are included by local path so CI validates the working tree,
# not whatever is currently published on main.
substitutions:
  name: "ci-deta-3-gang-middle-fan"
  friendly_name: "CI Deta 3-gang-middle-fan"

packages:
  base: !include ../esphome/packages/config/detagrid-smart-switch/base.yaml
  variant: !include ../esphome/packages/config/detagrid-smart-switch/3-gang-middle-fan.yaml

api:
  encryption:
    key: !secret apikey

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
