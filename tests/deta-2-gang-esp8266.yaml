# CI fixture: DETA Grid Connect switch, ESP8266 + 2-gang.
# Packages are included by local path so CI validates the working tree,
# not whatever is currently published on main.
substitutions:
  name: "ci-deta-2-gang"
  friendly_name: "CI Deta 2-gang"

packages:
  base: !include ../esphome/packages/config/deta/grid-connect-switch/base-esp8266.yaml
  variant: !include ../esphome/packages/config/deta/grid-connect-switch/2-gang-esp8266.yaml

api:
  encryption:
    key: !secret apikey

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
