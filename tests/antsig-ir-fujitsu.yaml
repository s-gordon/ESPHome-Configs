# CI fixture: Antsig IR blaster, fujitsu climate.
# base expects ${room} and ${area}; the climate package expects a
# temperature sensor with id: temperature from the device config.
substitutions:
  room: "ci"
  area: "CI"

packages:
  base: !include ../esphome/packages/config/antsig/ir-blaster/base-bk72xx-cb3s.yaml
  climate: !include ../esphome/packages/config/antsig/ir-blaster/climate-fujitsu.yaml

api:
  encryption:
    key: !secret apikey

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: homeassistant
    id: temperature
    entity_id: sensor.ci_room_temperature
