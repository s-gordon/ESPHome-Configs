substitutions:
  name: "${room}-ir-blaster"
  friendly_name: "${area} Antsig IR Blaster"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Oldest version CI validates against; bump both together.
  min_version: 2026.7.4

bk72xx:
  board: cb3s
  framework:
    version: recommended

# Enable logging
logger:

light:
  - platform: status_led
    name: "Status"
    pin: P8

remote_transmitter:
  pin: P26
  carrier_duty_percent: 50%

# Receiver allows the original remote to be used and HA to follow along
remote_receiver:
  id: rcvr
  pin:
    number: P7
    inverted: true
    mode:
      input: true
      pullup: true
  tolerance: 55%