# Requires the device config to provide a temperature sensor with
# `id: temperature` - typically a homeassistant platform sensor pointing at
# a room sensor. Without it this package fails config validation.
climate:
  - platform: daikin
    supports_cool: true
    supports_heat: true
    visual:
      max_temperature: 26
      min_temperature: 16
      temperature_step: 1
    name: "AC"
    receiver_id: rcvr
    sensor: temperature
