substitutions:
  led_pin: GPIO4
  switch_1_relay_pin: GPIO13
  switch_2_relay_pin: GPIO14
  switch_1_button_pin: GPIO16
  switch_2_button_pin: GPIO12

output:
  # 1st gang
  - platform: gpio
    pin: ${switch_1_relay_pin}
    id: relay_1

  # 2nd gang
  - platform: gpio
    pin: ${switch_2_relay_pin}
    id: relay_2

# Alternative: drive the LED through the top-level status_led component
# instead of the light platform below. It keeps indicating status in OTA
# safe mode, where the light platform is not loaded, but the LED is then
# not controllable from Home Assistant. Both forms drive the same pin, so
# uncommenting this means deleting the "Status LED" entry under light:.
#
# Note that neither form stops the LED blinking when the API or wifi drops
# - status indication takes precedence in warning state. To silence that
# entirely, replace it with `light: - platform: binary` on ${led_pin},
# which gives manual control and no status indication at all.
#
# status_led:
#   pin:
#     number: ${led_pin}
#     inverted: true

light:
  # Status LED
  - platform: status_led
    name: "Status"
    id: status_light
    pin:
      number: ${led_pin}
      inverted: true

  # 1st gang
  - platform: binary
    name: "1st"
    output: relay_1
    id: light_1

  # 2nd gang
  - platform: binary
    name: "2nd"
    output: relay_2
    id: light_2

binary_sensor:
  # 1st gang
  - platform: gpio
    pin:
      number: ${switch_1_button_pin}
      mode: INPUT
      inverted: true
    name: "1st Button"
    # toggle relay on push
    on_press:
      then:
        - light.toggle: light_1

  # 2nd gang
  - platform: gpio
    pin:
      number: ${switch_2_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "2nd Button"
    # toggle relay on push
    on_press:
      then:
        - light.toggle: light_2
