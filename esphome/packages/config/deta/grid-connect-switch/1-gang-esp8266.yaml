substitutions:
  led_pin: GPIO4
  switch_1_relay_pin: GPIO13
  switch_1_button_pin: GPIO16

status_led:
  pin:
    number: ${led_pin}
    inverted: true

output:
  # 1st gang
  - platform: gpio
    pin: ${switch_1_relay_pin}
    id: relay_1

light:
  # 1st gang
  - platform: binary
    name: "1st"
    output: relay_1
    id: light_1

binary_sensor:
  # 1st gang
  - platform: gpio
    pin:
      number: ${switch_1_button_pin}
      mode: INPUT
      inverted: true
    name: "1st Button"
    # toggle relay on push
    on_press:
      then:
        - light.toggle: light_1
