esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

bk72xx:
  board: wb3s
  framework:
    version: recommended

wifi:
  # Fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name}"

captive_portal:

logger:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

switch:
  - platform: restart
    name: "Restart"
