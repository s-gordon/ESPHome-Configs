esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  # Oldest version CI validates against; bump both together.
  min_version: 2026.7.4

bk72xx:
  board: cb3s
  framework:
    version: recommended

wifi:
  # Fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name}"

captive_portal:

logger:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"

switch:
  - platform: restart
    name: "Restart"
