substitutions:
  led_pin: P9
  switch_1_relay_pin: P6
  switch_2_relay_pin: P26
  switch_1_button_pin: P14
  switch_2_button_pin: P24
  device_icon: "mdi:light-recessed"

status_led:
  pin:
    number: ${led_pin}
    inverted: true

output:
  # 1st gang
  - platform: gpio
    pin: ${switch_1_relay_pin}
    id: relay_1

  # 2nd gang
  - platform: gpio
    pin: ${switch_2_relay_pin}
    id: relay_2

light:
  # 1st gang
  - platform: binary
    name: "1st"
    output: relay_1
    id: light_1
    icon: ${device_icon}

  # 2nd gang
  - platform: binary
    name: "2nd"
    output: relay_2
    id: light_2
    icon: ${device_icon}

binary_sensor:
  # 1st gang
  - platform: gpio
    pin:
      number: ${switch_1_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "1st Button"
    # toggle relay on push
    on_press:
      then:
        - light.toggle: light_1
    internal: true

  # 2nd gang
  - platform: gpio
    pin:
      number: ${switch_2_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "2nd Button"
    # toggle relay on push
    on_press:
      then:
        - light.toggle: light_2
    internal: true
